<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 基础财务系统</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="login-body">
<div class="login-orb login-orb-1"></div>
<div class="login-orb login-orb-2"></div>
<div class="login-card">
    <h1 class="login-title">基础财务系统</h1>
    <p class="login-sub">请登录后继续</p>

    <form id="login-form" class="login-form" onsubmit="return false;">
        <div class="form-item">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" autocomplete="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-item">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <div class="form-item">
            <label for="captcha_code">验证码</label>
            <div class="captcha-row">
                <input type="text" id="captcha_code" name="captcha_code" maxlength="10" autocomplete="off" placeholder="请输入验证码">
                <img class="captcha-img" id="captcha-img" title="看不清？点击刷新" alt="验证码">
            </div>
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="button" class="btn btn-primary btn-block" id="login-btn">登 录</button>
    </form>
</div>
<script src="/static/js/login.js"></script>
</body>
</html>
